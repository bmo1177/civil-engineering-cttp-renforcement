<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg4)" rx="12"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="720" height="36" rx="12" fill="#1E293B"/>
  <rect x="0" y="24" width="720" height="12" fill="#1E293B"/>
  <circle cx="20" cy="18" r="5" fill="#EF4444"/>
  <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="18" r="5" fill="#10B981"/>
  <rect x="80" y="12" width="220" height="14" rx="4" fill="#334155"/>
  <text x="190" y="23" font-family="system-ui" font-size="8" fill="#64748B" text-anchor="middle">http://localhost:3000</text>

  <!-- Header bar -->
  <rect x="0" y="36" width="720" height="40" fill="url(#header)"/>
  <text x="16" y="62" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">CTTP Renforcement</text>
  <text x="180" y="62" font-family="system-ui" font-size="9" fill="#64748B">Pavement Design</text>
  <rect x="620" y="46" width="80" height="22" rx="4" fill="#D97706"/>
  <text x="660" y="61" font-family="system-ui" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">Export PDF</text>

  <!-- Tab bar -->
  <rect x="0" y="76" width="720" height="36" fill="#0F172A"/>
  <rect x="12" y="82" width="80" height="24" rx="4" fill="#fff"/>
  <text x="52" y="98" font-family="system-ui" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Design</text>
  <rect x="96" y="82" width="80" height="24" rx="4" fill="transparent"/>
  <text x="136" y="98" font-family="system-ui" font-size="11" fill="#64748B" text-anchor="middle">Analysis</text>

  <!-- Left column: Design inputs -->
  <rect x="12" y="120" width="320" height="344" rx="8" fill="#1E293B"/>
  <text x="24" y="144" font-family="system-ui" font-size="12" font-weight="700" fill="#E2E8F0">Design Parameters</text>

  <!-- Traffic Class -->
  <rect x="24" y="156" width="296" height="50" rx="4" fill="#0F172A"/>
  <text x="32" y="170" font-family="system-ui" font-size="9" fill="#94A3B8">Traffic Class</text>
  <rect x="32" y="178" width="276" height="20" rx="4" fill="#1E293B"/>
  <text x="44" y="193" font-family="system-ui" font-size="10" fill="#E2E8F0">T3 — 1.5×10⁶-4.0×10⁶ PL cumulés</text>

  <!-- Surface Type -->
  <rect x="24" y="212" width="296" height="50" rx="4" fill="#0F172A"/>
  <text x="32" y="226" font-family="system-ui" font-size="9" fill="#94A3B8">Surface Type</text>
  <rect x="32" y="234" width="276" height="20" rx="4" fill="#1E293B"/>
  <text x="44" y="249" font-family="system-ui" font-size="10" fill="#E2E8F0">BB — Béton Bitumineux</text>

  <!-- Visual Status -->
  <rect x="24" y="268" width="296" height="50" rx="4" fill="#0F172A"/>
  <text x="32" y="282" font-family="system-ui" font-size="9" fill="#94A3B8">Visual Status</text>
  <rect x="32" y="290" width="276" height="20" rx="4" fill="#1E293B"/>
  <text x="44" y="305" font-family="system-ui" font-size="10" fill="#E2E8F0">Moyen — Non Acceptable</text>

  <!-- Deflection -->
  <rect x="24" y="324" width="296" height="60" rx="4" fill="#0F172A"/>
  <text x="32" y="338" font-family="system-ui" font-size="9" fill="#94A3B8">Deflection Correction</text>
  <text x="32" y="354" font-family="system-ui" font-size="9" fill="#64748B">d = 70 × 1.25 × 1.00 × 1.045 = 91.44 1/100mm</text>
  <rect x="32" y="360" width="120" height="16" rx="4" fill="#D97706"/>
  <text x="92" y="372" font-family="system-ui" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Zone T4 — Très Fort</text>

  <!-- Compute Button -->
  <rect x="24" y="394" width="296" height="36" rx="6" fill="#D97706"/>
  <text x="172" y="417" font-family="system-ui" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Compute Reinforcement</text>

  <!-- Right column: Results -->
  <rect x="344" y="120" width="364" height="344" rx="8" fill="#1E293B"/>

  <!-- Detection Canvas placeholder -->
  <rect x="356" y="132" width="340" height="180" rx="6" fill="#0F172A"/>
  <rect x="356" y="132" width="340" height="180" rx="6" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="526" y="190" font-family="system-ui" font-size="11" fill="#64748B" text-anchor="middle">Road Surface Image</text>
  <text x="526" y="206" font-family="system-ui" font-size="9" fill="#475569" text-anchor="middle">Upload an image to analyze</text>

  <!-- Detection box mockup -->
  <rect x="420" y="155" width="160" height="12" rx="2" fill="#EF4444" opacity="0.3" stroke="#EF4444" stroke-width="1"/>
  <rect x="419" y="143" width="100" height="14" rx="3" fill="#EF4444"/>
  <text x="430" y="154" font-family="system-ui" font-size="8" font-weight="700" fill="#fff">Longitudinal Crack</text>

  <rect x="530" y="230" width="50" height="45" rx="2" fill="#F59E0B" opacity="0.3" stroke="#F59E0B" stroke-width="1"/>
  <rect x="529" y="218" width="70" height="14" rx="3" fill="#F59E0B"/>
  <text x="540" y="229" font-family="system-ui" font-size="8" font-weight="700" fill="#fff">Pothole</text>

  <!-- Metrics panel -->
  <rect x="356" y="322" width="340" height="130" rx="6" fill="#0F172A"/>
  <text x="368" y="344" font-family="system-ui" font-size="11" font-weight="700" fill="#E2E8F0">Engineering Metrics</text>

  <rect x="368" y="354" width="100" height="50" rx="4" fill="#1E293B"/>
  <text x="418" y="372" font-family="system-ui" font-size="9" fill="#64748B" text-anchor="middle">Traffic</text>
  <text x="418" y="392" font-family="system-ui" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">T3</text>

  <rect x="478" y="354" width="100" height="50" rx="4" fill="#1E293B"/>
  <text x="528" y="372" font-family="system-ui" font-size="9" fill="#64748B" text-anchor="middle">Deflection</text>
  <text x="528" y="392" font-family="system-ui" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">91.44</text>

  <rect x="588" y="354" width="100" height="50" rx="4" fill="#1E293B"/>
  <text x="638" y="372" font-family="system-ui" font-size="9" fill="#64748B" text-anchor="middle">Status</text>
  <text x="638" y="392" font-family="system-ui" font-size="14" font-weight="700" fill="#EF4444" text-anchor="middle">Mauvais</text>

  <!-- Detection overlay dots -->
  <circle cx="500" cy="165" r="2" fill="#EF4444"/>
  <circle cx="480" cy="170" r="2" fill="#EF4444"/>
  <circle cx="555" cy="240" r="2" fill="#F59E0B"/>
</svg>
