<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#15294A"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2F1A"/>
      <stop offset="100%" stop-color="#2D2414"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A2E"/>
      <stop offset="100%" stop-color="#142C22"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#bg2)" rx="16"/>

  <!-- Title -->
  <text x="480" y="38" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">APPLICATION WORKFLOW</text>
  <line x1="380" y1="48" x2="580" y2="48" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Step 1: Upload -->
  <g transform="translate(50, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="url(#box1)"/>
    <rect x="0" y="0" width="190" height="130" rx="10" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
    <circle cx="95" cy="30" r="16" fill="#3B82F6" opacity="0.2"/>
    <text x="95" y="36" font-family="system-ui" font-size="16" fill="#3B82F6" text-anchor="middle" font-weight="700">1</text>
    <text x="95" y="65" font-family="system-ui" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Upload Image</text>
    <text x="95" y="85" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Drag &amp; drop or browse</text>
    <text x="95" y="100" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">a pavement surface photo</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(250, 130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2"/>
    <polygon points="40,-6 50,0 40,6" fill="#475569"/>
  </g>

  <!-- Step 2: AI Analysis -->
  <g transform="translate(300, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="url(#box2)"/>
    <rect x="0" y="0" width="190" height="130" rx="10" fill="none" stroke="#D97706" stroke-width="1" opacity="0.3"/>
    <circle cx="95" cy="30" r="16" fill="#D97706" opacity="0.2"/>
    <text x="95" y="36" font-family="system-ui" font-size="16" fill="#D97706" text-anchor="middle" font-weight="700">2</text>
    <text x="95" y="65" font-family="system-ui" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">AI Analysis</text>
    <text x="95" y="85" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Gemini VLM → Detections</text>
    <text x="95" y="100" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Keras+YOLO → Classification</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(500, 130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2"/>
    <polygon points="40,-6 50,0 40,6" fill="#475569"/>
  </g>

  <!-- Step 3: Design Input -->
  <g transform="translate(550, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="url(#box3)"/>
    <rect x="0" y="0" width="190" height="130" rx="10" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3"/>
    <circle cx="95" cy="30" r="16" fill="#10B981" opacity="0.2"/>
    <text x="95" y="36" font-family="system-ui" font-size="16" fill="#10B981" text-anchor="middle" font-weight="700">3</text>
    <text x="95" y="65" font-family="system-ui" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Design Parameters</text>
    <text x="95" y="85" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Traffic class, deflection,</text>
    <text x="95" y="100" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">surface type, UNI</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(750, 130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2"/>
    <polygon points="40,-6 50,0 40,6" fill="#475569"/>
  </g>

  <!-- Step 4: Compute -->
  <g transform="translate(50, 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="130" rx="10" fill="url(#box1)"/>
    <rect x="0" y="0" width="280" height="130" rx="10" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>
    <circle cx="140" cy="30" r="16" fill="#8B5CF6" opacity="0.2"/>
    <text x="140" y="36" font-family="system-ui" font-size="16" fill="#8B5CF6" text-anchor="middle" font-weight="700">4</text>
    <text x="140" y="65" font-family="system-ui" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">CTTP Design Engine</text>
    <text x="140" y="85" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Validates inputs → Computes deflection →</text>
    <text x="140" y="100" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Looks up reinforcement matrix → Returns structure</text>
  </g>

  <!-- Arrow 4 -->
  <g transform="translate(340, 290)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2"/>
    <polygon points="40,-6 50,0 40,6" fill="#475569"/>
  </g>

  <!-- Step 5: Results -->
  <g transform="translate(390, 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="130" rx="10" fill="url(#box2)"/>
    <rect x="0" y="0" width="280" height="130" rx="10" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>
    <circle cx="140" cy="30" r="16" fill="#F59E0B" opacity="0.2"/>
    <text x="140" y="36" font-family="system-ui" font-size="16" fill="#F59E0B" text-anchor="middle" font-weight="700">5</text>
    <text x="140" y="65" font-family="system-ui" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Review Results</text>
    <text x="140" y="85" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Reinforcement type &amp; structure</text>
    <text x="140" y="100" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Detection overlay on image</text>
  </g>

  <!-- Arrow 5 -->
  <g transform="translate(680, 290)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2"/>
    <polygon points="40,-6 50,0 40,6" fill="#475569"/>
  </g>

  <!-- Step 6: Export -->
  <g transform="translate(730, 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="url(#box3)"/>
    <rect x="0" y="0" width="180" height="130" rx="10" fill="none" stroke="#EC4899" stroke-width="1" opacity="0.3"/>
    <circle cx="90" cy="30" r="16" fill="#EC4899" opacity="0.2"/>
    <text x="90" y="36" font-family="system-ui" font-size="16" fill="#EC4899" text-anchor="middle" font-weight="700">6</text>
    <text x="90" y="65" font-family="system-ui" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Export PDF</text>
    <text x="90" y="85" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Full design report</text>
    <text x="90" y="100" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">with traceability</text>
  </g>

  <!-- Footer -->
  <text x="480" y="400" font-family="system-ui" font-size="10" fill="#475569" text-anchor="middle" letter-spacing="1">CTTP — GUIDE DES RENFORCEMENTS DES CHAUSSÉES SOUPLES (DÉC. 1992)</text>
</svg>
