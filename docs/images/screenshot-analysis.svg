<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="header2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg5)" rx="12"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="720" height="36" rx="12" fill="#1E293B"/>
  <rect x="0" y="24" width="720" height="12" fill="#1E293B"/>
  <circle cx="20" cy="18" r="5" fill="#EF4444"/>
  <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="18" r="5" fill="#10B981"/>
  <rect x="80" y="12" width="220" height="14" rx="4" fill="#334155"/>
  <text x="190" y="23" font-family="system-ui" font-size="8" fill="#64748B" text-anchor="middle">http://localhost:3000</text>

  <!-- Header -->
  <rect x="0" y="36" width="720" height="40" fill="url(#header2)"/>
  <text x="16" y="62" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">CTTP Renforcement</text>
  <rect x="620" y="46" width="80" height="22" rx="4" fill="#D97706"/>
  <text x="660" y="61" font-family="system-ui" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">Export PDF</text>

  <!-- Tab bar -->
  <rect x="0" y="76" width="720" height="36" fill="#0F172A"/>
  <rect x="12" y="82" width="80" height="24" rx="4" fill="transparent"/>
  <text x="52" y="98" font-family="system-ui" font-size="11" fill="#64748B" text-anchor="middle">Design</text>
  <rect x="96" y="82" width="80" height="24" rx="4" fill="#fff"/>
  <text x="136" y="98" font-family="system-ui" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Analysis</text>

  <!-- Left column: Upload + Controls -->
  <rect x="12" y="120" width="320" height="344" rx="8" fill="#1E293B"/>

  <!-- Upload area -->
  <rect x="24" y="132" width="296" height="140" rx="8" fill="#0F172A" stroke-dasharray="6,3" stroke="#334155" stroke-width="2"/>
  <text x="172" y="180" font-family="system-ui" font-size="24" fill="#475569" text-anchor="middle">📷</text>
  <text x="172" y="210" font-family="system-ui" font-size="11" fill="#64748B" text-anchor="middle">Drop pavement image here</text>
  <text x="172" y="228" font-family="system-ui" font-size="9" fill="#475569" text-anchor="middle">or click to browse</text>
  <text x="172" y="248" font-family="system-ui" font-size="8" fill="#475569" text-anchor="middle">JPG, PNG — Max 20MB</text>

  <!-- Analyze buttons -->
  <rect x="24" y="282" width="296" height="36" rx="6" fill="#3B82F6"/>
  <text x="172" y="305" font-family="system-ui" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">⚡ Analyze with AI (Gemini)</text>

  <rect x="24" y="324" width="296" height="36" rx="6" fill="#6366F1"/>
  <rect x="24" y="324" width="296" height="36" rx="6" fill="none" stroke="#818CF8" stroke-width="1"/>
  <text x="172" y="347" font-family="system-ui" font-size="11" font-weight="700" fill="#E0E7FF" text-anchor="middle">🧪 Classify with Local Models (Keras + YOLO)</text>

  <!-- Local results card -->
  <rect x="24" y="368" width="296" height="84" rx="6" fill="#0F172A" stroke="#6366F1" stroke-width="1" opacity="0.6"/>

  <text x="36" y="388" font-family="system-ui" font-size="9" font-weight="700" fill="#818CF8">Local Model Classification</text>

  <!-- Keras result -->
  <rect x="36" y="396" width="272" height="20" rx="4" fill="#1E293B"/>
  <circle cx="46" cy="406" r="4" fill="#3B82F6"/>
  <text x="58" y="410" font-family="system-ui" font-size="9" fill="#E2E8F0">Keras</text>
  <text x="230" y="410" font-family="system-ui" font-size="9" font-weight="700" fill="#F59E0B">satisfactory</text>
  <rect x="280" y="401" width="24" height="14" rx="3" fill="transparent" stroke="#475569" stroke-width="1"/>
  <text x="292" y="412" font-family="system-ui" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">51%</text>

  <!-- YOLO result -->
  <rect x="36" y="418" width="272" height="20" rx="4" fill="#1E293B"/>
  <circle cx="46" cy="428" r="4" fill="#8B5CF6"/>
  <text x="58" y="432" font-family="system-ui" font-size="9" fill="#E2E8F0">YOLOv8</text>
  <text x="230" y="432" font-family="system-ui" font-size="9" font-weight="700" fill="#EF4444">very_poor</text>
  <rect x="280" y="423" width="24" height="14" rx="3" fill="transparent" stroke="#475569" stroke-width="1"/>
  <text x="292" y="434" font-family="system-ui" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">69%</text>

  <!-- Right column: Detection Results -->
  <rect x="344" y="120" width="364" height="344" rx="8" fill="#1E293B"/>

  <!-- Image with detections -->
  <rect x="356" y="132" width="340" height="200" rx="6" fill="#0F172A"/>

  <!-- Detection boxes on image -->
  <rect x="390" y="150" width="200" height="14" rx="2" fill="#EF4444" opacity="0.25" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="389" y="136" width="130" height="16" rx="3" fill="#EF4444"/>
  <text x="398" y="149" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">Fissures longitudinales</text>
  <text x="578" y="149" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">87%</text>

  <rect x="520" y="250" width="60" height="55" rx="2" fill="#F59E0B" opacity="0.25" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="519" y="234" width="90" height="16" rx="3" fill="#F59E0B"/>
  <text x="528" y="247" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">Nids de poule</text>
  <text x="598" y="247" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">92%</text>

  <rect x="400" y="170" width="15" height="150" rx="2" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
  <rect x="399" y="156" width="90" height="16" rx="3" fill="#3B82F6"/>
  <text x="408" y="169" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">Transversales</text>
  <text x="478" y="169" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">78%</text>

  <!-- Detection count badge -->
  <rect x="630" y="140" width="56" height="20" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="658" y="154" font-family="system-ui" font-size="9" font-weight="700" fill="#E2E8F0" text-anchor="middle">4 détections</text>

  <!-- Detection list -->
  <rect x="356" y="344" width="340" height="108" rx="6" fill="#0F172A"/>
  <text x="368" y="364" font-family="system-ui" font-size="11" font-weight="700" fill="#E2E8F0">Detected Distresses (4)</text>

  <rect x="368" y="374" width="316" height="22" rx="4" fill="#1E293B"/>
  <circle cx="380" cy="385" r="4" fill="#EF4444"/>
  <text x="392" y="389" font-family="system-ui" font-size="10" fill="#E2E8F0">Fissures longitudinales</text>
  <rect x="638" y="377" width="42" height="16" rx="3" fill="transparent" stroke="#475569" stroke-width="1"/>
  <text x="659" y="389" font-family="system-ui" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">87%</text>

  <rect x="368" y="398" width="316" height="22" rx="4" fill="#1E293B"/>
  <circle cx="380" cy="409" r="4" fill="#F59E0B"/>
  <text x="392" y="413" font-family="system-ui" font-size="10" fill="#E2E8F0">Nids de poule</text>
  <rect x="638" y="401" width="42" height="16" rx="3" fill="transparent" stroke="#475569" stroke-width="1"/>
  <text x="659" y="413" font-family="system-ui" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">92%</text>

  <rect x="368" y="422" width="316" height="22" rx="4" fill="#1E293B"/>
  <circle cx="380" cy="433" r="4" fill="#3B82F6"/>
  <text x="392" y="437" font-family="system-ui" font-size="10" fill="#E2E8F0">Fissures transversales</text>
  <rect x="638" y="425" width="42" height="16" rx="3" fill="transparent" stroke="#475569" stroke-width="1"/>
  <text x="659" y="437" font-family="system-ui" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">78%</text>
</svg>
