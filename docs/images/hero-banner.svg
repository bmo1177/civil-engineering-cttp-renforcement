<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="badge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)" rx="16"/>
  <rect x="0" y="0" width="1280" height="320" fill="url(#bg)" rx="16"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="213" y1="0" x2="213" y2="320"/>
    <line x1="426" y1="0" x2="426" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="853" y1="0" x2="853" y2="320"/>
    <line x1="1066" y1="0" x2="1066" y2="320"/>
  </g>

  <!-- Road icon -->
  <g transform="translate(80, 60)" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 100 L40 20" stroke-width="2.5"/>
    <path d="M60 100 L40 20" stroke-width="2.5"/>
    <path d="M40 100 L40 75 M40 60 L40 45 M40 35 L40 25"/>
    <path d="M5 100 L75 100" stroke-width="2.5"/>
    <path d="M0 105 L80 105" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="40" cy="100" r="3" fill="#D97706" stroke="none"/>
    <circle cx="12" cy="85" r="2" fill="#D97706" stroke="none" opacity="0.6"/>
    <circle cx="16" cy="65" r="2" fill="#D97706" stroke="none" opacity="0.6"/>
    <circle cx="68" cy="85" r="2" fill="#D97706" stroke="none" opacity="0.6"/>
    <circle cx="64" cy="65" r="2" fill="#D97706" stroke="none" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="200" y="105" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    CTTP Renforcement
  </text>

  <!-- Subtitle -->
  <text x="200" y="148" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#94A3B8" font-weight="400" letter-spacing="0.3">
    Pavement Distress Detection &amp; Reinforcement Design
  </text>

  <!-- Accent line -->
  <rect x="200" y="168" width="80" height="4" rx="2" fill="url(#line)"/>

  <!-- Description -->
  <text x="200" y="200" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748B" font-weight="400">
    RN120 PK70-80 · CTTP Guide des Renforcements (Déc. 1992) · Direction des Études Techniques — Tiaret
  </text>

  <!-- Badges -->
  <g transform="translate(200, 230)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="url(#badge1)"/>
    <text x="60" y="19" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Next.js 16</text>

    <rect x="132" y="0" width="110" height="28" rx="6" fill="url(#badge2)"/>
    <text x="187" y="19" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">React 19</text>

    <rect x="254" y="0" width="110" height="28" rx="6" fill="#059669"/>
    <text x="309" y="19" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Tauri v2</text>

    <rect x="376" y="0" width="120" height="28" rx="6" fill="#7C3AED"/>
    <text x="436" y="19" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">TensorFlow</text>

    <rect x="508" y="0" width="110" height="28" rx="6" fill="#DC2626"/>
    <text x="563" y="19" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">PyTorch</text>

    <rect x="630" y="0" width="100" height="28" rx="6" fill="#0F766E"/>
    <text x="680" y="19" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Gemini AI</text>
  </g>

  <!-- Right side abstract visualization -->
  <g transform="translate(880, 50)" opacity="0.15">
    <rect x="0" y="0" width="340" height="220" rx="12" fill="none" stroke="#D97706" stroke-width="1"/>
    <rect x="20" y="20" width="140" height="80" rx="8" fill="#D97706" opacity="0.3"/>
    <rect x="180" y="20" width="140" height="80" rx="8" fill="#3B82F6" opacity="0.3"/>
    <rect x="20" y="120" width="300" height="80" rx="8" fill="#10B981" opacity="0.2"/>
    <circle cx="170" cy="200" r="4" fill="#D97706"/>
    <line x1="170" y1="204" x2="170" y2="240" stroke="#D97706" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
</svg>
