[package]
name = "cttp-renforcement"
version = "1.0.0"
description = "CTTP-compliant pavement reinforcement design tool"
authors = ["CTTP Direction des Études Techniques"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
reqwest = { version = "0.13.4", features = ["multipart", "json"] }
tokio = { version = "1.52.3", features = ["time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
